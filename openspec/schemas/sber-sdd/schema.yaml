name: sber-sdd
version: 1
description: Порядок артефактов proposal, decisions, specs, tasks, review-report; design — необязательная ветка от proposal
artifacts:
  - id: proposal
    generates: proposal.md
    description: Предложение о том, зачем нужно изменение и что оно меняет
    template: proposal.md
    instruction: |
      Создай proposal: документ о том, зачем нужно изменение.

      Разделы:
      - `## Why`: одно-два предложения о том, какую проблему решает изменение и почему его делают сейчас. Дай ссылку на источник постановки: тикет или обращение.
      - `## What Changes`: список изменений. Назови конкретно, какие возможности появляются, меняются или удаляются. Несовместимые изменения пометь `**BREAKING**`.
      - `## Capabilities`: какие спеки будут созданы или изменены.
        - `### New Capabilities`: новые capability. Каждая станет файлом `specs/<capability-path>/spec.md`. Называй capability по устойчивому поведению системы (например, `user-auth`), не по работе в этом изменении (например, `add-login-endpoint`). Граница capability должна вмещать связанные требования по мере развития системы; capability «обо всём» не заводи. Новые сегменты пути пиши в kebab-case (`user-auth` или `identity/user-auth`) и следуй раскладке спек, принятой в проекте.
        - `### Modified Capabilities`: существующие capability, у которых меняются требования. Включай capability, только если меняется поведение на уровне спеки, а не детали реализации. Для каждой нужен файл дельты. Путь бери точно как в `openspec/specs/`. Если требования не меняются, оставь раздел пустым.
      - `## Impact`: затронутый код, API, зависимости и системы поимённо. Для каждого затронутого внешнего контракта (API, очередь, схема БД) назови его потребителя.

      Раздел `## Capabilities` связывает proposal со specs. Перед тем как его заполнять,
      изучи существующие спеки: `openspec list --specs` выводит перечень capability
      проекта, а `openspec show "<spec-id>" --type spec --json --no-scenarios` по
      похожим возвращает назначение capability и тексты требований, не загружая файлы
      спек целиком. Флаг `--store "<id>"` добавляй к обеим командам только для
      зарегистрированного отдельного хранилища (store). `--type spec` оставляй всегда:
      если имена изменения и спеки совпадают, без него будет ошибка неоднозначности.
      `openspec list` без `--specs` выводит изменения в работе, спеки проекта он не
      показывает. Если подходящая capability уже есть, используй её точный путь и не
      заводи похожее имя. Сокращённый вывод годится только для обзора: прежде чем решать,
      что уже покрыто и что меняется, прочитай каждую относящуюся к делу спеку целиком,
      со сценариями, через `openspec show "<spec-id>" --type spec` (правило `--store`
      то же). Для каждой capability из этого раздела понадобится файл спеки.

      Изменение либо объявляет хотя бы одну capability (новую или изменённую), либо
      явно отказывается от спек: `openspec validate` отклоняет изменение без дельт,
      если в его `.openspec.yaml` нет `skip_specs: true`. Ставь `skip_specs: true`,
      только когда поведение на уровне спек не меняется (рефакторинг, инструменты,
      документация): спеки описывают поведение, и раз оно не меняется, спеки тоже не
      меняются. Требование ради прохождения проверки не выдумывай.

      Объём — одна-две страницы. Пиши о причинах изменения; детали реализации
      относятся к design.md.

      Текст артефакта — на русском; структурные токены (заголовки разделов из шаблона, `**BREAKING**`, пути capability) не переводить.
    requires: []

  - id: decisions
    generates: decisions.md
    description: Решения по изменению, закрытые допросом пользователя; без них specs не пишутся
    template: decisions.md
    instruction: |
      Закрой все решения по изменению до того, как писать specs.

      Проведи допрос скиллом `sbp-grill` и записывай результат в decisions.md по шаблону.
      - Факты ищи сам: код, конфиги, `openspec/specs`, уроки из `openspec/changes/archive/*/worklog.md` по изменениям с теми же capability (их находит `ls -d openspec/changes/archive/*/specs/<capability-path>`). Пользователя спрашивай только о решениях.
      - Каждый ответ записывай сразу тройкой «Вопрос / Выбор / Почему».
      - Рекомендация, которую пользователь явно не принял, решением не считается: вопрос остаётся в разделе `## Open` и входит в счётчик.
      - Первая строка файла — `Open questions: <N>`, заголовка перед ней нет. `Open questions: 0` ставь только после того, как показал пользователю итоговый список решений и получил явное «да». Молчание и смена темы согласием не считаются.

      Если скилл `sbp-grill` недоступен:
      1. Задавай по одному вопросу с рекомендацией: «<вопрос> Рекомендую X, потому что Y. Подходит?». Если независимых вопросов три и больше, задай их одним пронумерованным списком, у каждого своя рекомендация.
      2. Сначала закрывай корневые решения, зависящие от них вопросы задавай после.
      3. Когда ветки закрыты, покажи итоговый список и дождись явного «да».

      Текст артефакта — на русском; структурные токены (`Open questions:`, `## Open`) не переводить.
    requires:
      - proposal

  - id: specs
    generates: "specs/**/*.md"
    description: Спеки изменения — дельты требований по каждой capability
    template: spec.md
    instruction: |
      Создай файлы спек: они описывают, что должна делать система.

      Не начинай, пока в decisions.md `Open questions:` больше 0: сначала закрой вопросы с пользователем.

      Спека — контракт поведения. План реализации в ней не пишут.

      Что писать в спеке:
      - наблюдаемое поведение, на которое опираются пользователи и смежные системы;
      - входы, выходы и ошибки;
      - внешние ограничения: безопасность, приватность, надёжность, совместимость;
      - сценарии, которые можно проверить тестом или явной проверкой.

      Чего в спеке быть не должно:
      - имён внутренних классов и функций;
      - выбора библиотек и фреймворков;
      - пошаговых деталей реализации;
      - подробных планов работ (они в design.md или tasks.md).

      Каждое требование проверяется снаружи системы, без чтения кода. Если реализацию
      можно поменять, не меняя поведения, видимого снаружи, такое описание в спеке,
      скорее всего, лишнее. Каждый сценарий — будущий тест.

      Создай по одному файлу спеки на каждую capability из раздела `## Capabilities` в proposal.
      `<capability-path>` — каталог спеки относительно `specs/` (например, `user-auth`
      или `identity/user-auth`). Путь сохраняй целиком:
      - Новая capability: путь точно как в proposal, файл `specs/<capability-path>/spec.md`. Новые сегменты пути пиши в kebab-case. Следуй раскладке, принятой в проекте: если спеки лежат плоско, новый уровень домена не добавляй.
      - Изменённая capability: путь точно как в `openspec/specs/<capability-path>/`, дельта — в `specs/<capability-path>/spec.md`. Перед записью дельты сверь путь по `openspec list --specs` (`--store "<id>"` — только для зарегистрированного отдельного хранилища): опечатка или выдуманный путь указывают на несуществующую capability вместо нужной. Capability не переносить и не переименовывать.

      Нужен хотя бы один файл спеки, если в `.openspec.yaml` изменения нет
      `skip_specs: true` (поведение на уровне спек не меняется): без этой метки
      `openspec validate` отклоняет изменение без дельт. Если в proposal нет ни одной
      capability и `skip_specs` не задан, сначала вернись к proposal.

      Операции дельты (заголовки `##`):
      - `## ADDED Requirements` — новое поведение;
      - `## MODIFIED Requirements` — изменённое поведение, обязательно с полным обновлённым текстом;
      - `## REMOVED Requirements` — удаляемое поведение, обязательно с `**Reason**` и `**Migration**`;
      - `## RENAMED Requirements` — только смена имени, в формате `FROM:`/`TO:`.

      Формат:
      - Требование: `### Requirement: <имя>`, под ним описание в форме «Система SHALL …».
      - Нормативные слова — `SHALL` или `MUST` латиницей. «Должна», should и may `openspec validate --strict` нормативными не считает.
      - Сценарий: `#### Scenario: <имя>` в формате `**WHEN**`/`**THEN**`.
      - У сценария ровно четыре решётки (`####`). С тремя решётками или пунктом списка сценарий пропадает без ошибки.
      - У каждого требования хотя бы один сценарий.
      - Описание требования (текст между `### Requirement:` и первым сценарием) — не длиннее 500 символов. `openspec validate` отмечает более длинные описания, когда они попадают в основную спеку; это подсказка, не ошибка. Новое требование описывает одно поведение: примеры и крайние случаи уходят в сценарии, а требование о нескольких поведениях делится на отдельные блоки `### Requirement:` со своими сценариями. В MODIFIED существующий блок сохраняй целиком: ради длины его не делят, не сокращают и не переписывают.

      Только для новой capability: первый раздел дельты — `## Purpose`, одно-два
      предложения (от 50 символов, иначе `openspec validate --strict` сочтёт раздел
      слишком коротким) о том, зачем нужна capability. Архивация переносит его в
      создаваемую основную спеку; без него в новой спеке останется заглушка
      `TBD ... Update Purpose after archive`, которую придётся заполнять вручную.
      В дельту существующей capability `## Purpose` не добавляй: у её спеки он уже
      есть, а раздел из дельты игнорируется. Чтобы изменить Purpose существующей
      capability, в том числе оставшуюся заглушку `TBD`, правь
      `<planningHome.root>/openspec/specs/<capability-path>/spec.md` напрямую.
      `planningHome.root` приходит в ответе `openspec instructions ... --json`.
      Бери путь от него, а не от корня репозитория: он указывает на хранилище, если
      изменение живёт в нём (через `--store`, указатель `store:` в проекте или
      глобальное хранилище по умолчанию), и на текущий репозиторий в остальных
      случаях. Выяснять, какой случай твой, не нужно: поле его уже учитывает.

      Как писать MODIFIED:
      1. Найди требование в `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (тот же корень с учётом хранилища).
      2. Скопируй блок требования целиком: от `### Requirement:` до конца всех его сценариев.
      3. Вставь блок под `## MODIFIED Requirements` и измени под новое поведение.
      4. Проверь, что заголовок требования совпадает с исходным (пробелы не учитываются).

      Частая ошибка: MODIFIED с неполным текстом теряет детали при архивации.
      Если добавляешь новое, не меняя существующего поведения, используй ADDED.

      Пример (новая capability, поэтому первый раздел — `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Даёт пользователю выгрузить свои данные из продукта в переносимом формате.

      ## ADDED Requirements

      ### Requirement: Выгрузка данных пользователя
      Система SHALL позволять пользователю выгрузить свои данные в формате CSV.

      #### Scenario: Успешная выгрузка
      - **WHEN** пользователь нажимает кнопку «Выгрузить»
      - **THEN** система отдаёт CSV-файл со всеми данными пользователя

      ## REMOVED Requirements

      ### Requirement: Старая выгрузка
      **Reason**: заменена новой выгрузкой
      **Migration**: использовать эндпоинт /api/v2/export
      ```

      Текст артефакта — на русском; структурные токены (`# Spec Delta`, `## Purpose`, заголовки операций, `### Requirement:`, `#### Scenario:`, `SHALL`/`MUST`, `**WHEN**`/`**THEN**`, `**Reason**`/`**Migration**`, `FROM:`/`TO:`) не переводить.
    requires:
      - proposal
      - decisions

  - id: tasks
    generates: tasks.md
    description: Список задач реализации с отслеживаемыми чекбоксами
    template: tasks.md
    instruction: |
      Создай tasks.md: разбиение работы по реализации на задачи.

      Перед задачами:
      - Если изменение подпадает под условия из инструкции design (`openspec instructions design --change "<id>"`), а design.md нет, сначала создай design.md.
      - Если в design.md есть «Открытые вопросы», которые меняют то, что будет сделано, сначала закрой их с пользователем. Неявное допущение в список задач не закладывай.

      Следуй шаблону точно: фаза apply отслеживает прогресс по чекбоксам. Выполненной
      считается задача, в скобках которой только `x`, в любом регистре и с любыми
      пробелами, так что `- [ x]` тоже выполнена. `x` — латинская: кириллическая «х»
      не засчитывается. Любой другой маркер, в том числе `- [~]`, `- [-]` и пустой
      `- []`, означает, что задача не выполнена. Строка без чекбокса не отслеживается.

      Правила:
      - Задачи сгруппированы под нумерованными заголовками `## N.`.
      - Каждая задача — чекбокс: `- [ ] N.M Описание задачи`.
      - Задача помещается в одну сессию.
      - Задачи упорядочены по зависимостям: сначала то, без чего не начать остальное.
      - В строке каждой задачи указан способ проверки: тест, команда, наблюдаемое поведение или готовый артефакт. Отдельная задача на проверку нужна, только когда проверяется интеграция или поведение системы, охватывающее несколько задач.
      - Каждое `### Requirement` из дельт спек покрыто хотя бы одной задачей, и имя требования указано в строке задачи.
      - Группа — вертикальный срез: тесты и документацию, которых требует её работа, она делает сама. Не собирай тесты и документацию в последнюю группу: когда поздняя группа впервые проверяет работу ранней, ошибки приходится исправлять во всех промежуточных группах. Группе, работе которой не нужны ни тесты, ни документация (заготовка структуры, подключение зависимостей), их не добавляют. Последняя группа — только для интеграционных проверок; тесты и документацию ранних групп туда не переносят.
      - Группа `## R. Review` из шаблона стоит в конце файла без изменений. Её задачи отмечает `/sbp-review`; вручную их не отмечай и не удаляй.

      Пример:
      ```
      # Задачи

      ## 1. Подготовка

      - [ ] 1.1 Создать структуру модуля выгрузки; проверка: файлы модуля на месте
      - [ ] 1.2 Подготовить обезличенную локальную фикстуру; проверка: обработчик читает её без обращения к внешним системам

      ## 2. Выгрузка данных

      - [ ] 2.1 Реализовать выгрузку по требованию «Выгрузка данных пользователя»; проверка: тест выгрузки проходит
      - [ ] 2.2 Добавить форматирование CSV; проверка: модульные тесты покрывают кавычки и разделители
      - [ ] 2.3 Описать API выгрузки в docs/export.md; проверка: команда из документации выполняется как написано

      ## R. Review

      - [ ] R.1 Axis-A: PASS зафиксирован в review-report.md
      - [ ] R.2 Axis-B: ACCEPT зафиксирован в review-report.md
      ```

      Что строить, бери из спек, как строить — из design.md.

      Текст артефакта — на русском; структурные токены (`## N.`, `- [ ]`/`- [x]`, id задач `N.M`, группа `## R. Review` с её задачами) не переводить.
    requires:
      - specs

  - id: review-report
    generates: review-report.md
    description: Вердикты ревью по двум осям; пишет только /sbp-review после реализации
    template: review-report.md
    instruction: |
      Этот артефакт создаёт только команда `/sbp-review` после реализации (`/opsx-apply`).
      При планировании его не создавай и вручную не заполняй.

      Если тебя просят создать review-report.md вне `/sbp-review`, остановись и скажи
      пользователю: сначала реализация, затем `/sbp-review`.

      Текст артефакта — на русском; структурные токены (ключи шапки `Axis-A`, `Axis-B`, `Tests-exit-code`, `Reviewers`, `Date`, вердикты, классы находок) не переводить.
    requires:
      - tasks

  - id: design
    generates: design.md
    description: Технический дизайн — как реализовать изменение
    template: design.md
    instruction: |
      Создай design.md: документ о том, как реализовать изменение.

      Если в изменении уже есть review-report.md, design.md не создавай: остановись и
      скажи пользователю, что design пишут до tasks, а ревью уже прошло без него.

      Когда нужен design.md (создавай, только если выполнено хотя бы одно условие):
      - изменение затрагивает несколько сервисов или модулей либо вводит новый архитектурный шаблон;
      - появляется новая внешняя зависимость или заметно меняется модель данных;
      - есть сложности с безопасностью, производительностью или миграцией;
      - есть неоднозначность, которую лучше снять техническими решениями до кода.

      Разделы:
      - «Контекст»: только текущее состояние и ограничения, без которых подход непонятен. Мотивацию не пересказывай, сошлись на proposal (например, «см. proposal.md, раздел Why»).
      - «Цели и границы»: чего добивается дизайн и что сознательно не входит. Границы из proposal не повторяй, добавляй только границы уровня дизайна.
      - «Технические решения»: основные технические выборы с обоснованием (почему X, а не Y) и рассмотренными альтернативами. Для трудно обратимых решений (публичный API, схема данных, граница модулей) альтернативу описывай контрактом: сигнатуры, ошибки, пример вызова. Одного названия альтернативы мало.
      - «Риски и компромиссы»: известные ограничения и что может пойти не так, в формате «риск → как снижаем».
      - «План миграции»: шаги развёртывания и отката, если они нужны.
      - «Открытые вопросы»: неизвестные, ответ на которые можно получить позже, не меняя спек, подхода и разбиения на задачи. Если таких нет, раздел не нужен.

      В «Открытые вопросы» попадает только то, что можно отложить. Если вопрос меняет
      спеки, подход или разбиение на задачи, реши его сейчас: спроси пользователя,
      не угадывай.

      Пиши об архитектуре и подходе, без построчной реализации. Proposal отвечает на
      вопросы «зачем» и «что», design — на вопрос «как». Мотивацию бери из proposal,
      требования — из спек, когда они написаны; если раздел только повторил бы их,
      дай ссылку.

      Текст артефакта — на русском; структурные токены (пути, имена capability и требований, идентификаторы из кода) не переводить.
    requires:
      - proposal

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Прочитай файлы контекста, выполняй незакрытые задачи и отмечай их по ходу.
    При блокере или неясности остановись и спроси.

    Перед первой задачей запусти полный прогон тестов. Если он красный, доложи
    пользователю и не начинай.

    Задача, которая меняет поведение, начинается с теста. Убедись, что он падает по
    верной причине: проверяемого поведения ещё нет. Падение из-за ошибки в самом тесте
    не считается. Затем пиши код.

    Каждая задача заканчивается полным прогоном тестов, чтением его вывода и одним
    коммитом `<type>(<N.M>): <описание>`. Отметка `[x]` задачи входит в тот же коммит.

    В каталоге изменения веди worklog.md: одна датированная запись на сессию. В записи:
    что сделано; отклонения от tasks.md с причиной; урок по формуле «в ситуации X
    делать Y вместо Z, потому что …» или строка «уроков нет».

    Задачи группы `## R. Review` не выполняй. Когда закрыты все остальные задачи,
    запусти `/sbp-review`: он отметит R.1 и R.2.

    worklog.md и описания коммитов — на русском; conventional-типы, id задач и структурные токены — латиницей.

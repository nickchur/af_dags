# /etc/krb5.conf хоста стенда: клиенты Kerberos (airflow kerberos, requests-kerberos, libpq).
# 2026-10-02 10:12 MSK · v1.0 · Nick Churkin · NSChurkin@sber.ru
#
# rdns и dns_canonicalize_hostname выключены: имена *.stand смотрят в 127.0.0.1, и обратный
# DNS превратил бы HTTP/ctl-mock.stand в HTTP/localhost — билета на такой принципал нет.
[libdefaults]
    default_realm = STAND.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    dns_canonicalize_hostname = false
    ticket_lifetime = 10h
    renew_lifetime = 7d
    forwardable = true
    udp_preference_limit = 1

[realms]
    STAND.TEST = {
        kdc = kdc.stand:88
    }

[domain_realm]
    .stand = STAND.TEST
    stand = STAND.TEST

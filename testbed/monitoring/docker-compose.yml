# Prometheus стенда отдельным проектом compose (infra/ не трогаем).
# 2026-10-02 10:25 MSK · v1.0 · Nick Churkin · NSChurkin@sber.ru
#   cd /opt/aftest/monitoring && docker compose up -d
# Сеть хоста: вебсервер слушает 127.0.0.1:8080, а сам Prometheus — только 127.0.0.1:9090
# (снаружи — туннель ssh -L 19090:127.0.0.1:9090 testsrv).
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aftest-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
volumes:
  prom-data:
